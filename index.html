<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bewertung">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d7377">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>tools-Bewertung</title>
<style>
  :root {
    --bg:#f4f6f7; --card:#fff; --text:#1d2b2c; --muted:#66777a; --line:#dde4e6;
    --accent:#0d7377; --accent-d:#095558; --sel:#0d7377; --warn:#b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14191a; --card:#1d2425; --text:#e6eeee; --muted:#93a5a8; --line:#304041; --accent:#27a3a8; --accent-d:#1f8a8e; --sel:#27a3a8; --warn:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; opacity:.85; font-size:13px; }
  nav { display:flex; gap:4px; padding:12px 20px 0; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); border-bottom:none; background:var(--card); color:var(--muted); padding:9px 16px; border-radius:8px 8px 0 0; cursor:pointer; font:inherit; }
  nav button.active { color:var(--accent); font-weight:600; box-shadow:inset 0 3px 0 var(--accent); }
  main { margin:0 20px 30px; background:var(--card); border:1px solid var(--line); border-radius:0 8px 8px 8px; padding:20px; max-width:900px; }
  h2 { margin:0 0 4px; font-size:18px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  th small { display:block; font-weight:400; }
  td.k, th.k { text-align:left; }
  td.k { font-weight:500; }
  input.w { width:60px; padding:4px; text-align:center; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  .cell { width:34px; height:34px; border:2px solid var(--line); border-radius:8px; background:var(--bg); cursor:pointer; padding:0; color:#fff; font-size:18px; line-height:1; }
  .cell:hover { border-color:var(--accent); }
  .cell.on { background:var(--sel); border-color:var(--sel); }
  .cell.on::after { content:"✓"; }
  .result { margin-top:20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .grade { font-size:40px; font-weight:700; color:var(--accent); min-width:100px; }
  .meta { color:var(--muted); font-size:13px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:8px; cursor:pointer; font:inherit; font-weight:600; }
  .btn:hover { background:var(--accent-d); }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .actions { margin-left:auto; display:flex; gap:8px; }
  .help h3 { margin:18px 0 6px; font-size:15px; }
  .help ol { padding-left:20px; margin:0; }
  .help li { margin:3px 0; }
  .note { margin-top:14px; font-size:12px; color:var(--muted); }
  button, input { touch-action:manipulation; }
  @media (max-width:600px) {
    header { padding-left:14px; padding-right:14px; }
    nav { padding:10px 8px 0; gap:3px; }
    nav button { padding:8px 9px; font-size:13px; }
    main { margin:0 8px 24px; padding:12px 8px; border-radius:0 0 8px 8px; }
    th, td { padding:7px 2px; }
    td.k { font-size:13px; line-height:1.25; padding-right:4px; }
    input.w { width:46px; font-size:16px; }
    .cell { width:35px; height:35px; }
    .grade { font-size:34px; min-width:0; }
    .actions { margin-left:0; width:100%; }
    .actions .btn { flex:1; padding:11px 8px; font-size:14px; }
  }
</style>
</head>
<body>
<header>
  <h1>tools-Bewertung</h1>
  <p>Schnellbewertung aus dem Unterricht</p>
</header>
<nav id="tabs"></nav>
<main id="view"></main>

<script>
// Notenwerte je Spalte (fest hinterlegt, wie in der Excel-Vorlage)
const LEVELS = [["E",6],["D",4],["C",3],["B",2],["A",1]];

// Standard-Kriterien und Gewichtungen aus tools-Bewertung-v0.01
const DEFAULTS = {
  "Experiment": [["Durchführung",3],["Ablauf",2.5],["Ergebnis",3],["Umgang mit Schwierigkeiten",1.5]],
  "Vortrag": [["Verständlichkeit",2],["Struktur",2],["Fachsprache im Vortrag",1.5],["Reaktion auf Rückfragen",1.5],["Vortragsweise",1],["Medieneinsatz",1],["Quellenangabe",1]],
  "Schriftl. Ausarbeitung": [["Inhalt",3],["Aufbau",1.5],["Fachsprache",1],["Sprache & Ausdruck",1],["Rechtschreibung & Grammatik",1],["Umfang & Eigenständigkeit",1.5],["Quellenangabe",1]],
  "Mündl. Mitarbeit": [["Quantität",1],["Fachliche Qualität",1],["Fachsprache",1],["Zuhören & Eingehen auf andere",1],["Mitarbeit bei Aufgaben & Experimenten",1],["Kontinuität",1]]
};
const TABS = ["Anleitung", ...Object.keys(DEFAULTS)];

// Zustand: Gewichtungen (dauerhaft gespeichert) und Markierungen
const STORE = "tools-bewertung-v1";
let state = load();
let current = TABS[1];

function fresh() {
  const s = {};
  for (const [name, rows] of Object.entries(DEFAULTS))
    s[name] = rows.map(([k, w]) => ({ k, w, sel: null }));
  return s;
}
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if (saved) {
      const s = fresh();
      for (const name in s) if (saved[name] && saved[name].length === s[name].length)
        s[name].forEach((r, i) => { r.w = saved[name][i].w; r.sel = saved[name][i].sel; });
      return s;
    }
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

function fmt(n) { return n.toLocaleString("de-DE", { maximumFractionDigits: 3 }); }

function calc(rows) {
  const rated = rows.filter(r => r.sel !== null);
  const wsum = rated.reduce((a, r) => a + r.w, 0);
  const avg = wsum > 0 ? rated.reduce((a, r) => a + r.w * r.sel, 0) / wsum : null;
  return { count: rated.length, total: rows.length, wtotal: rows.reduce((a, r) => a + r.w, 0), avg };
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  for (const t of TABS) {
    const b = document.createElement("button");
    b.textContent = t;
    b.className = t === current ? "active" : "";
    b.onclick = () => { current = t; render(); };
    nav.appendChild(b);
  }
}

function render() {
  renderTabs();
  const v = document.getElementById("view");
  if (current === "Anleitung") { v.innerHTML = helpHTML(); return; }
  const rows = state[current];
  let h = `<h2>Bewertung: ${current}</h2>
    <div class="sub">Notenwerte: ${LEVELS.map(([l, n]) => `${l} = ${n}`).join(" · ")} &nbsp;|&nbsp; Gewichtung anpassbar</div>
    <table><thead><tr><th class="k">Kriterium</th><th>Gewichtung</th>`
    + LEVELS.map(([l, n]) => `<th>${l}<small>${n}</small></th>`).join("") + `</tr></thead><tbody>`;
  rows.forEach((r, i) => {
    h += `<tr><td class="k">${r.k}</td>
      <td><input class="w" type="number" min="0" step="0.5" value="${r.w}" data-i="${i}"></td>`;
    for (const [, n] of LEVELS)
      h += `<td><button class="cell${r.sel === n ? " on" : ""}" data-i="${i}" data-n="${n}" aria-label="${r.k}: ${n}"></button></td>`;
    h += `</tr>`;
  });
  h += `</tbody></table><div class="result" id="result"></div>
    <div class="note">Nicht bewertete Zeilen zählen nicht mit. Erneutes Anklicken nimmt die Markierung zurück.</div>`;
  v.innerHTML = h;

  v.querySelectorAll(".cell").forEach(b => b.onclick = () => {
    const r = rows[+b.dataset.i], n = +b.dataset.n;
    r.sel = r.sel === n ? null : n;
    save(); render();
  });
  v.querySelectorAll("input.w").forEach(inp => inp.onchange = () => {
    const w = parseFloat(String(inp.value).replace(",", "."));
    rows[+inp.dataset.i].w = isNaN(w) || w < 0 ? 0 : w;
    save(); render();
  });
  updateResult();
}

function updateResult() {
  const c = calc(state[current]);
  document.getElementById("result").innerHTML = `
    <div><div class="meta">Ergebnis (gewichteter Durchschnitt)</div>
      <div class="grade">${c.avg === null ? "–" : fmt(Math.round(c.avg * 100) / 100)}</div></div>
    <div class="meta">Bewertete Kriterien: ${c.count} von ${c.total}<br>Summe aller Gewichtungen: ${fmt(c.wtotal)}</div>
    <div class="actions">
      <button class="btn ghost" id="rs">Dieses Blatt zurücksetzen</button>
      <button class="btn" id="ra">Alle zurücksetzen</button>
    </div>`;
  document.getElementById("rs").onclick = () => {
    if (confirm(`Alle Markierungen im Blatt „${current}“ löschen?`)) { state[current].forEach(r => r.sel = null); save(); render(); }
  };
  document.getElementById("ra").onclick = () => {
    if (confirm("Alle Markierungen in allen vier Blättern löschen?")) {
      for (const n in state) state[n].forEach(r => r.sel = null);
      save(); render();
    }
  };
}

function helpHTML() {
  return `<div class="help"><h2>So wird die App benutzt</h2>
  <div class="sub">Für jede Bewertungskategorie gibt es ein eigenes Blatt: Experiment, Vortrag, Schriftliche Ausarbeitung, Mündliche Mitarbeit.</div>
  <ol>
    <li>Im passenden Blatt bei jedem erreichten Kriterium das Kästchen in der zutreffenden Spalte (E, D, C, B oder A) anklicken.</li>
    <li>Kriterien ohne Markierung werden bei der Berechnung nicht berücksichtigt.</li>
    <li>Die Gewichtung jedes Kriteriums steht in der Spalte „Gewichtung“ und kann jederzeit angepasst werden.</li>
    <li>Unten im Blatt erscheint automatisch das Ergebnis: der gewichtete Durchschnitt aller markierten Kriterien.</li>
    <li>Mit „Zurücksetzen“ werden die Markierungen gelöscht.</li>
  </ol>
  <h3>Notenwerte (fest hinterlegt)</h3>
  <div>E = 6 &nbsp; D = 4 &nbsp; C = 3 &nbsp; B = 2 &nbsp; A = 1</div>
  <div class="note">Markierungen und Gewichtungen werden automatisch in diesem Browser/Programm gespeichert. Es werden keine Daten übertragen. Basis: tools-Bewertung-v0.01.</div>
  <p><button class="btn ghost" id="rw">Gewichtungen auf Standard zurücksetzen</button></p></div>`;
}

document.addEventListener("click", e => {
  if (e.target.id === "rw" && confirm("Alle Gewichtungen auf die Standardwerte zurücksetzen?")) {
    const d = fresh();
    for (const n in state) state[n].forEach((r, i) => r.w = d[n][i].w);
    save(); alert("Gewichtungen zurückgesetzt.");
  }
});

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
